<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="zoraxy.csrf.Token" content="{{.csrfToken}}">
<title>Technitium Sync</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1b1b1b;
    --bg: #ffffff;
    --muted: #666666;
    --border: #d7d7d7;
    --accent: #2563eb;
    --ok: #1a7f37;
    --warn: #b45309;
    --err: #c0392b;
    --panel: #f7f7f8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e8e8e8;
      --bg: #16171a;
      --muted: #a0a0a0;
      --border: #33343a;
      --accent: #5b9dff;
      --ok: #3fbf60;
      --warn: #e0a933;
      --err: #e05c4d;
      --panel: #1e1f23;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--fg);
    background: var(--bg);
    max-width: 780px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; font-size: 13px; }
  section {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 20px;
    background: var(--panel);
  }
  section h2 { font-size: 15px; margin-top: 0; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin: 12px 0 4px;
  }
  label .hint { font-weight: 400; color: var(--muted); }
  input[type=text], input[type=password], input[type=number] {
    width: 100%;
    padding: 7px 9px;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
  }
  .row { display: flex; gap: 16px; }
  .row > div { flex: 1; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .checkbox-row input { width: auto; }
  button {
    margin-top: 16px;
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #saveMsg { margin-left: 12px; font-size: 13px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; font-size: 13px; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.ok { background: rgba(26,127,55,0.15); color: var(--ok); }
  .badge.err { background: rgba(192,57,43,0.15); color: var(--err); }
  .warn-banner {
    background: rgba(180,83,9,0.15);
    color: var(--warn);
    border: 1px solid var(--warn);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .host-list { font-size: 12px; color: var(--muted); word-break: break-all; }
  code { font-size: 12px; }
  .readonly { color: var(--muted); }
</style>
</head>
<body>
  <h1>Technitium Sync</h1>
  <p class="sub">Keeps Technitium A/AAAA/HTTPS records in sync with Zoraxy's HTTP proxy host rules.</p>

  <section>
    <h2>Status</h2>
    <div id="warnBanner"></div>
    <dl id="statusList">
      <dt>Last poll</dt><dd id="stLastPoll">&mdash;</dd>
      <dt>Result</dt><dd id="stResult">&mdash;</dd>
      <dt>Managed records</dt><dd id="stManaged">&mdash;</dd>
      <dt>Created (last cycle)</dt><dd id="stCreated" class="host-list">&mdash;</dd>
      <dt>Updated (last cycle)</dt><dd id="stUpdated" class="host-list">&mdash;</dd>
      <dt>Deleted (last cycle)</dt><dd id="stDeleted" class="host-list">&mdash;</dd>
      <dt>Skipped (foreign records)</dt><dd id="stSkipped" class="host-list">&mdash;</dd>
    </dl>
  </section>

  <section>
    <h2>Configuration</h2>
    <form id="cfgForm">
      <div class="row">
        <div>
          <label>Technitium base URL <span class="hint">e.g. http://192.168.1.254:5380</span></label>
          <input type="text" id="technitium_base_url" required>
        </div>
        <div>
          <label>Technitium API token <span class="hint" id="tokenHint"></span></label>
          <input type="password" id="technitium_token" autocomplete="off" placeholder="enter API token">
        </div>
      </div>

      <div class="row">
        <div>
          <label>DNS zone</label>
          <input type="text" id="zone" required>
        </div>
        <div>
          <label>Record TTL (seconds)</label>
          <input type="number" id="ttl_seconds" min="30" required>
        </div>
      </div>

      <div class="row">
        <div>
          <label>Poll interval (seconds)</label>
          <input type="number" id="poll_interval_seconds" min="5" required>
        </div>
        <div>
          <label>LAN IPv4 target <span class="hint">A records point here</span></label>
          <input type="text" id="lan_ipv4" required>
        </div>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="aaaa_enabled">
        <label for="aaaa_enabled" style="margin:0;">Also create AAAA records (global toggle)</label>
      </div>
      <div>
        <label>LAN IPv6 target <span class="hint">used for every managed host when AAAA is enabled</span></label>
        <input type="text" id="lan_ipv6">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="https_enabled">
        <label for="https_enabled" style="margin:0;">Also create HTTPS records (global toggle)</label>
      </div>
      <div>
        <label>HTTPS priority <span class="hint">0 = alias mode (params and hints have no effect); 1 or higher = service mode</span></label>
        <input type="number" id="https_priority" min="0" max="65535" placeholder="1">
      </div>
      <div>
        <label>HTTPS target name</label>
        <input type="text" id="https_target_name" placeholder=".">
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="https_auto_ipv4_hint">
        <label for="https_auto_ipv4_hint" style="margin:0;">Use automatic IPv4 hint</label>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="https_auto_ipv6_hint">
        <label for="https_auto_ipv6_hint" style="margin:0;">Use automatic IPv6 hint</label>
      </div>
      <label>HTTPS params</label>
      <div id="httpsParams"></div>
      <button type="button" id="httpsAddParamBtn">Add param</button>

      <label>Instance ID <span class="hint">generated once, used in the ownership TXT marker</span></label>
      <input type="text" id="instance_id" class="readonly" readonly>

      <button type="button" id="saveBtn">Save</button>
      <span id="saveMsg"></span>
    </form>
  </section>

<script>
(function () {
  var csrfToken = document.querySelector('meta[name="zoraxy.csrf.Token"]').content;
  var base = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');

  function apiURL(path) { return base + path; }

  function fmtList(arr) {
    if (!arr || arr.length === 0) return '(none)';
    return arr.join(', ');
  }

  function fmtTime(iso) {
    if (!iso || iso.indexOf('0001-01-01') === 0) return 'never';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return 'never';
    return d.toLocaleString();
  }

  // ---- HTTPS params table -------------------------------------------------
  // The params list mirrors Technitium's own HTTPS record editor: each row
  // has a key dropdown (the RFC key names, or "Unknown", which turns the key
  // cell into a "key number" text field expecting the raw numeric SVC param
  // key code and a hex-string value) and a value field, plus a remove
  // button. State lives in the httpsParams array; the DOM is re-rendered
  // from it on structural changes only.
  var HTTPS_PARAM_KEYS = ['mandatory', 'alpn', 'no-default-alpn', 'port', 'ipv4hint', 'ipv6hint', 'dohpath'];
  var httpsParams = [];
  var httpsParamContainer = document.getElementById('httpsParams');

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function httpsPriorityValue() {
    var n = parseInt(document.getElementById('https_priority').value, 10);
    return isNaN(n) ? 1 : n;
  }

  function isNumericParamKey(key) {
    return /^\d+$/.test((key || '').trim());
  }

  function renderParamRows() {
    var html = '';
    for (var i = 0; i < httpsParams.length; i++) {
      html += renderParamRow(httpsParams[i], i);
    }
    httpsParamContainer.innerHTML = html;
    attachParamListeners();
  }

  function renderParamRow(row, idx) {
    var unknown = !!row.unknown || isNumericParamKey(row.key);
    var keyCell;
    if (unknown) {
      // Once "Unknown" is chosen (or the key is numeric), the key cell
      // becomes a free-text "key number" field, like Technitium's editor.
      keyCell = '<input type="text" data-param-idx="' + idx + '" data-param-role="key" placeholder="key number" value="' + esc(row.key) + '">';
    } else {
      var options = '';
      for (var k = 0; k < HTTPS_PARAM_KEYS.length; k++) {
        options += '<option' + (row.key === HTTPS_PARAM_KEYS[k] ? ' selected' : '') + '>' + HTTPS_PARAM_KEYS[k] + '</option>';
      }
      options += '<option>Unknown</option>';
      keyCell = '<select data-param-idx="' + idx + '" data-param-role="key">' + options + '</select>';
    }
    var valuePlaceholder = unknown ? 'hex string' : 'value';
    return '<div class="row">' +
      '<label style="margin:0;font-size:12px;">Key</label>' + keyCell +
      '<label style="margin:0;font-size:12px;">Value</label>' +
      '<input type="text" data-param-idx="' + idx + '" data-param-role="value" placeholder="' + valuePlaceholder + '" value="' + esc(row.value) + '">' +
      '<button type="button" data-param-idx="' + idx + '" data-param-role="remove">Remove</button>' +
      '</div>';
  }

  function attachParamListeners() {
    var els = httpsParamContainer.querySelectorAll('input,select,button');
    for (var i = 0; i < els.length; i++) {
      attachParamListener(els[i]);
    }
  }

  function attachParamListener(el) {
    var idxAttr = el.getAttribute('data-param-idx');
    var role = el.getAttribute('data-param-role');
    if (idxAttr === null || role === null) return;
    var idx = parseInt(idxAttr, 10);
    var row = httpsParams[idx];
    if (!row) return;

    if (role === 'key') {
      if (el.tagName === 'SELECT') {
        el.addEventListener('change', function () {
          var v = el.value || '';
          if (v === 'Unknown') {
            row.unknown = true;
            row.key = '';
          } else {
            row.unknown = false;
            row.key = v;
          }
          renderParamRows();
        });
      } else {
        el.addEventListener('change', function () {
          // Typing a key number here; update state in place (no re-render:
          // the input already shows what was typed, and re-rendering would
          // drop the browser's edit focus mid-field).
          row.key = el.value.trim();
          row.unknown = !!row.unknown;
        });
      }
    } else if (role === 'value') {
      el.addEventListener('change', function () {
        row.value = el.value;
      });
    } else if (role === 'remove') {
      el.addEventListener('click', function () {
        httpsParams.splice(idx, 1);
        renderParamRows();
      });
    }
  }

  document.getElementById('httpsAddParamBtn').addEventListener('click', function () {
    // Start on the first dropdown entry so the row's state matches what the
    // select displays (an empty key would be dropped on save).
    httpsParams.push({ key: HTTPS_PARAM_KEYS[0], value: '' });
    renderParamRows();
  });

  // ---- config load / save -------------------------------------------------

  function loadConfig() {
    fetch(apiURL('/api/config')).then(function (r) { return r.json(); }).then(function (cfg) {
      document.getElementById('technitium_base_url').value = cfg.technitium_base_url || '';
      // The server never returns the real token (GET /api/config only says
      // whether one is set), so this field always starts blank. Leaving it
      // blank on save keeps whatever token is already stored.
      var tokenInput = document.getElementById('technitium_token');
      tokenInput.value = '';
      tokenInput.placeholder = cfg.technitium_token_set
        ? '(unchanged — leave blank to keep current token)'
        : 'enter API token';
      document.getElementById('tokenHint').textContent = cfg.technitium_token_set ? '(a token is set)' : '(no token set)';
      document.getElementById('zone').value = cfg.zone || '';
      document.getElementById('ttl_seconds').value = cfg.ttl_seconds || '';
      document.getElementById('poll_interval_seconds').value = cfg.poll_interval_seconds || '';
      document.getElementById('lan_ipv4').value = cfg.lan_ipv4 || '';
      document.getElementById('aaaa_enabled').checked = !!cfg.aaaa_enabled;
      document.getElementById('lan_ipv6').value = cfg.lan_ipv6 || '';
      document.getElementById('instance_id').value = cfg.instance_id || '';

      document.getElementById('https_enabled').checked = !!cfg.https_enabled;
      // Priority and target name show their defaults (1 and ".") only as
      // grey placeholders, so a value equal to the default loads as an empty
      // field. 0 is a real, non-default value (alias mode) and is shown.
      var priorityVal = cfg.https_priority;
      document.getElementById('https_priority').value =
        (priorityVal === undefined || priorityVal === null || priorityVal === 1) ? '' : String(priorityVal);
      var targetVal = (cfg.https_target_name || '').trim();
      document.getElementById('https_target_name').value = (targetVal === '.') ? '' : targetVal;
      document.getElementById('https_auto_ipv4_hint').checked = cfg.https_auto_ipv4_hint !== false;
      document.getElementById('https_auto_ipv6_hint').checked = cfg.https_auto_ipv6_hint !== false;

      httpsParams = (cfg.https_params || []).map(function (p) {
        return { key: p.key || '', value: p.value || '' };
      });
      renderParamRows();
    }).catch(function (err) {
      document.getElementById('saveMsg').textContent = 'Failed to load config: ' + err;
    });
  }

  function loadStatus() {
    fetch(apiURL('/api/status')).then(function (r) { return r.json(); }).then(function (st) {
      document.getElementById('stLastPoll').textContent = fmtTime(st.last_poll_time);
      var resultEl = document.getElementById('stResult');
      if (st.last_success) {
        resultEl.innerHTML = '<span class="badge ok">ok</span>';
      } else if (st.last_error) {
        resultEl.innerHTML = '<span class="badge err">error</span> ' + st.last_error;
      } else {
        resultEl.textContent = 'no poll yet';
      }
      document.getElementById('stManaged').textContent = st.managed_count || 0;
      document.getElementById('stCreated').textContent = fmtList(st.created);
      document.getElementById('stUpdated').textContent = fmtList(st.updated);
      document.getElementById('stDeleted').textContent = fmtList(st.deleted);
      document.getElementById('stSkipped').textContent = fmtList(st.skipped);

      var banner = document.getElementById('warnBanner');
      if (st.deletions_skipped) {
        banner.innerHTML = '<div class="warn-banner">Deletions were skipped this cycle: Zoraxy\'s proxy list looked ' +
          'suspiciously small (circuit breaker). Creates/updates still ran normally.</div>';
      } else {
        banner.innerHTML = '';
      }
    }).catch(function () { /* status endpoint not reachable yet; ignore */ });
  }

  // A plain button + click handler, not a form submit listener: this plugin
  // panel is loaded in a sandboxed iframe by Zoraxy's admin UI, and iframe
  // sandboxes without the "allow-forms" token block the browser's native
  // form-submission navigation outright - even when a submit handler calls
  // preventDefault(), some browsers still log/enforce the sandbox check on
  // the underlying <form> submit. Skipping form submission entirely (no
  // type="submit" button, so there's nothing for Enter-key implicit
  // submission to trigger either) avoids that restriction altogether.
  document.getElementById('saveBtn').addEventListener('click', function () {
    var btn = document.getElementById('saveBtn');
    var msg = document.getElementById('saveMsg');
    btn.disabled = true;
    msg.textContent = 'Saving...';
    msg.style.color = '';

    var payload = {
      technitium_base_url: document.getElementById('technitium_base_url').value.trim(),
      technitium_token: document.getElementById('technitium_token').value,
      zone: document.getElementById('zone').value.trim(),
      ttl_seconds: parseInt(document.getElementById('ttl_seconds').value, 10),
      poll_interval_seconds: parseInt(document.getElementById('poll_interval_seconds').value, 10),
      lan_ipv4: document.getElementById('lan_ipv4').value.trim(),
      aaaa_enabled: document.getElementById('aaaa_enabled').checked,
      lan_ipv6: document.getElementById('lan_ipv6').value.trim(),

      https_enabled: document.getElementById('https_enabled').checked,
      // 0 (alias mode) is a legitimate value, so only a blank/unparsable
      // input falls back to the default of 1. A blank target name is sent
      // as-is; the server treats it the same as ".".
      https_priority: httpsPriorityValue(),
      https_target_name: document.getElementById('https_target_name').value.trim(),
      // Rows whose key was never filled in are dropped; every kept row is
      // validated server-side (key spelling, value shape, duplicates).
      https_params: httpsParams
        .filter(function (r) { return (r.key || '').trim() !== ''; })
        .map(function (r) { return { key: r.key.trim(), value: r.value || '' }; }),
      https_auto_ipv4_hint: document.getElementById('https_auto_ipv4_hint').checked,
      https_auto_ipv6_hint: document.getElementById('https_auto_ipv6_hint').checked
    };

    fetch(apiURL('/api/config'), {
      method: 'POST',
      // Zoraxy's own front-door CSRF middleware (gorilla/csrf) checks for the
      // token under its own default header name, X-CSRF-Token - not
      // X-Zoraxy-Csrf, which is only the name Zoraxy uses to hand the token
      // to plugins for embedding in pages. Without X-CSRF-Token, Zoraxy
      // rejects the request with 403 before it ever reaches this plugin.
      headers: { 'Content-Type': 'application/json', 'X-Zoraxy-Csrf': csrfToken, 'X-CSRF-Token': csrfToken },
      body: JSON.stringify(payload)
    }).then(function (r) {
      return r.json().then(function (body) { return { ok: r.ok, body: body }; });
    }).then(function (result) {
      btn.disabled = false;
      if (result.ok) {
        msg.style.color = 'var(--ok)';
        msg.textContent = 'Saved.';
        loadConfig();
        setTimeout(loadStatus, 500);
      } else {
        msg.style.color = 'var(--err)';
        msg.textContent = 'Error: ' + (result.body && result.body.error ? result.body.error : 'save failed');
      }
    }).catch(function (err) {
      btn.disabled = false;
      msg.style.color = 'var(--err)';
      msg.textContent = 'Error: ' + err;
    });
  });

  loadConfig();
  loadStatus();
  setInterval(loadStatus, 5000);
})();
</script>
</body>
</html>
